[build]
  command = "echo static"
  publish = "public"
  functions = "netlify/functions"
[[redirects]]
  from = "/visit/sign-in"
  to = "/visit/sign-in.html"
  status = 200
[[redirects]]
  from = "/visit/sign-in/"
  to = "/visit/sign-in.html"
  status = 200
[[redirects]]
  from = "/visit/sign-out"
  to = "/visit/sign-out.html"
  status = 200
[[redirects]]
  from = "/visit/sign-out/"
  to = "/visit/sign-out.html"
  status = 200
[[redirects]]
  from = "/visit"
  to = "/visit.html"
  status = 200
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
[[redirects]]
  from = "/support"
  to = "/support/index.html"
  status = 200
[[redirects]]
  from = "/support/*"
  to = "/support/index.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "no-cache"

# www → apex primary
[[redirects]]
  from = "https://www.expresshelp.site/*"
  to = "https://expresshelp.site/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.expresshelp.site"
  to = "https://expresshelp.site/"
  status = 301
  force = true
[[redirects]]
  from = "http://www.expresshelp.site/*"
  to = "https://expresshelp.site/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://expresshelp.site/*"
  to = "https://expresshelp.site/:splat"
  status = 301
  force = true
