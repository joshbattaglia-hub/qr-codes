<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Set your password · Express Help</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1b4d'/%3E%3Cpath fill='%23e7c98a' d='M9.5 8h13v3.2h-9.2V24H9.5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
<div class="login">
  <main class="signin" aria-labelledby="sp-title">
    <div class="signin-brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0e1b4d"/><path fill="#e7c98a" d="M9.5 8h13v3.2h-9.2V24H9.5z"/></svg>
      <h1>Express Help</h1>
    </div>
    <div class="login-card signin-card">
      <section class="signin-section">
        <h2 id="sp-title" data-testid="sp-title">Set your password</h2>
        <p class="muted small" id="sp-lead" data-testid="sp-lead">Checking your link…</p>
        <form id="sp-form" hidden novalidate>
          <label class="field"><span>Email</span><input id="sp-email" type="email" autocomplete="username" readonly data-testid="sp-email"></label>
          <label class="field"><span>New password</span>
            <span class="pw-row"><input id="sp-pw" type="password" autocomplete="new-password" minlength="10" maxlength="128" required data-testid="sp-pw"><button class="btn ghost btn-xs pw-toggle" type="button" id="sp-toggle" data-testid="sp-toggle" aria-pressed="false" aria-controls="sp-pw sp-pw2">Show</button></span>
          </label>
          <label class="field"><span>Repeat password</span><input id="sp-pw2" type="password" autocomplete="new-password" minlength="10" maxlength="128" required data-testid="sp-pw2"></label>
          <p class="muted small">At least 10 characters. Not your email address and not a common password. A few random words works well.</p>
          <button class="btn" type="submit" id="sp-submit" data-testid="sp-submit">Set password</button>
          <p class="err" id="sp-error" data-testid="sp-error" role="alert"></p>
        </form>
        <div id="sp-done" hidden data-testid="sp-done">
          <p id="sp-done-text"></p>
          <p><a class="btn" href="/admin/" data-testid="sp-signin">Go to sign in</a></p>
        </div>
        <div id="sp-bad" hidden data-testid="sp-bad">
          <p id="sp-bad-text"></p>
          <p class="muted small">Ask Joshua to resend your invite, or on the <a href="/admin/">sign-in page</a> choose &ldquo;Forgot password?&rdquo;. You can also sign in with an email code.</p>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="/set-password.js" defer></script>
<script src="/footer.js" defer></script>
</body>
</html>
