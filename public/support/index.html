<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Support — Liberty Oil Convenience</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1b4d'/%3E%3Cpath fill='%23e7c98a' d='M9.5 8h13v3.2h-9.2V24H9.5z'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light; --ink:#1c2434; --muted:#667085; --line:#e6e8ee; --blue:#1f4bdb; --navy:#0e1b4d; --gold:#e7c98a; }
  * { box-sizing: border-box; }
  html, body { margin:0; overflow-x:clip; }
  body { font:16px/1.45 "Segoe UI", system-ui, sans-serif; background:#f3f4f8; color:var(--ink); }
  .shell { width:min(390px,100%); margin:0 auto; padding:0 0 48px; }
  header { display:flex; gap:10px; align-items:center; padding:16px 16px 12px; }
  header strong { display:block; font-size:15px; }
  header small { color:var(--muted); font-size:13px; }
  .mark { width:32px; height:32px; flex:none; }
  main { padding:0 16px; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { margin:0 0 10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; }
  label { display:flex; flex-direction:column; gap:6px; font-weight:600; margin:12px 0; }
  input, select, textarea { font:inherit; padding:10px 12px; border:1px solid #d0d5dd; border-radius:8px; width:100%; }
  textarea { min-height:96px; }
  button, .btn { font:inherit; font-weight:700; background:var(--blue); color:#fff; border:0; border-radius:8px; padding:12px 14px; min-height:44px; width:100%; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
  button.ghost, .btn.ghost { background:#fff; color:var(--navy); border:1px solid var(--line); }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  a { color:var(--blue); }
  .muted { color:var(--muted); font-weight:400; }
  .err { color:#d92d20; min-height:1.2em; }
  .ok { color:#067647; }
  .ticket { display:block; text-decoration:none; color:inherit; }
  .ticket h2 { font-size:16px; margin:0 0 4px; }
  .badge { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; background:#f2f4f7; color:#344054; }
  .badge.warn { background:#fee4e2; color:#b42318; }
  ul.timeline { margin:8px 0; padding-left:18px; }
  .msg { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0e1b4d"/><path fill="#e7c98a" d="M9.5 8h13v3.2h-9.2V24H9.5z"/></svg>
    <span><strong>Liberty Oil Convenience</strong><small>Express Help support</small></span>
  </header>
  <main id="app">Loading…</main>
</div>
<script type="module">
import { prepareTicketFile } from "/admin/ticket-file.mjs";

const STATUS_LABEL = { new: "New", "in-progress": "In progress", awaiting: "Awaiting info", scheduled: "Scheduled", done: "Done", closed: "Closed" };
const PRIORITY_LABEL = { low: "Low", normal: "Normal", high: "High", urgent: "Urgent" };
const QUEUE_LABEL = { screens: "Screens", signage: "Signage" };
const app = document.getElementById("app");
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => "&#" + ch.charCodeAt(0) + ";");

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (opts.body) headers["content-type"] = "application/json";
  const response = await fetch(path, { ...opts, headers, credentials: "same-origin" });
  const type = response.headers.get("content-type") || "";
  const body = type.includes("json") ? await response.json().catch(() => ({})) : null;
  if (!response.ok) throw new Error(body?.error || "That request was not completed.");
  return body;
}

function route() {
  const raw = location.pathname.replace(/\/+$/, "") || "/support";
  if (raw === "/support/new") return { name: "new" };
  const ticket = raw.match(/^\/support\/tickets\/(t[a-f0-9]{16})$/);
  if (ticket) return { name: "ticket", id: ticket[1] };
  return { name: "list" };
}

function signIn() {
  app.innerHTML = '<h1>Support tickets</h1><p class="muted">Sign in with your work email to submit or follow a screens or signage ticket.</p><form class="card" id="support-in"><label>Email<input type="email" id="support-email" required maxlength="254" autocomplete="username"></label><button type="submit" id="support-send">Email me a code</button><label id="support-code-wrap" hidden>8-digit code<input id="support-code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label><button type="button" class="ghost" id="support-verify" hidden>Verify code</button><p class="ok" id="support-status"></p><p class="err" id="support-error"></p></form>';
  const form = document.getElementById("support-in");
  const error = document.getElementById("support-error");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    error.textContent = "";
    try {
      const started = await api("/api/support/start", { method: "POST", body: JSON.stringify({ email: document.getElementById("support-email").value }) });
      document.getElementById("support-status").textContent = started.message || "";
      document.getElementById("support-code-wrap").hidden = false;
      document.getElementById("support-verify").hidden = false;
    } catch (err) { error.textContent = err.message; }
  });
  document.getElementById("support-verify").addEventListener("click", async () => {
    error.textContent = "";
    try {
      await api("/api/support/verify", { method: "POST", body: JSON.stringify({ email: document.getElementById("support-email").value, code: document.getElementById("support-code").value }) });
      location.href = "/support";
    } catch (err) { error.textContent = err.message; }
  });
}

function nav(session) {
  return '<p class="muted">Signed in as ' + esc(session.email) + '</p><div class="row"><a class="btn ghost" href="/support">My tickets</a><a class="btn" href="/support/new">Submit ticket</a></div><p><button class="ghost" type="button" id="support-out">Sign out</button></p>';
}

async function signOut() {
  await api("/api/support/logout", { method: "POST", body: "{}" });
  location.href = "/support";
}

async function home(session) {
  const listed = await api("/api/support/tickets");
  const rows = (listed.tickets || []).map((ticket) =>
    '<a class="card ticket" href="/support/tickets/' + esc(ticket.id) + '"><h2>' + esc(ticket.number) + " · " + esc(ticket.subject) + "</h2><p>" + esc(ticket.siteLabel) + " · " + esc(ticket.statusLabel) + (ticket.overdue ? ' <span class="badge warn">Overdue</span>' : "") + (ticket.access === "own" ? "" : ' <span class="badge">Read only</span>') + "</p></a>"
  ).join("");
  app.innerHTML = nav(session) + "<h1>My tickets</h1>" + (rows || '<div class="card"><p class="muted">No tickets yet.</p></div>');
  document.getElementById("support-out").addEventListener("click", signOut);
}

async function create(session) {
  const sites = (session.siteChoices || []).map((site) => '<option value="' + esc(site.id) + '">' + esc(site.name) + (site.area ? " · " + esc(site.area) : "") + "</option>").join("") + '<option value="other">Other</option>';
  const types = ["screens", "signage"].map((queue) => '<optgroup label="' + esc(QUEUE_LABEL[queue]) + '">' + (session.types?.[queue] || []).map((type) => '<option value="' + queue + "|" + esc(type) + '">' + esc(type) + "</option>").join("") + "</optgroup>").join("");
  const priorities = Object.entries(PRIORITY_LABEL).map(([value, label]) => '<option value="' + value + '"' + (value === "normal" ? " selected" : "") + ">" + esc(label) + "</option>").join("");
  app.innerHTML = nav(session) + "<h1>Submit ticket</h1><form class=\"card\" id=\"support-new\"><label>Request type<select id=\"support-type\" required>" + types + '</select></label><label>Site<select id="support-site"><option value="">Choose a site</option>' + sites + '</select></label><label id="support-other-wrap" hidden>Other site<input id="support-other" maxlength="80"></label><label>Priority<select id="support-priority">' + priorities + '</select></label><label>Needed by<input id="support-by" type="date"></label><label>Subject<input id="support-subject" required maxlength="140"></label><label>Description<textarea id="support-body" required maxlength="4000"></textarea></label><label>Photos or PDFs<input id="support-files" type="file" accept="image/*,application/pdf" multiple></label><button type="submit">Submit ticket</button><p class="err" id="support-error"></p></form>';
  document.getElementById("support-out").addEventListener("click", signOut);
  document.getElementById("support-site").addEventListener("change", (event) => { document.getElementById("support-other-wrap").hidden = event.target.value !== "other"; });
  document.getElementById("support-new").addEventListener("submit", async (event) => {
    event.preventDefault();
    const error = document.getElementById("support-error");
    error.textContent = "";
    const [queue, requestType] = document.getElementById("support-type").value.split("|");
    try {
      const created = await api("/api/support/tickets", { method: "POST", body: JSON.stringify({
        queue, requestType,
        siteId: document.getElementById("support-site").value,
        siteOther: document.getElementById("support-other").value,
        priority: document.getElementById("support-priority").value,
        neededBy: document.getElementById("support-by").value,
        subject: document.getElementById("support-subject").value,
        description: document.getElementById("support-body").value,
      }) });
      const files = Array.from(document.getElementById("support-files").files || []);
      for (const file of files) {
        const payload = await prepareTicketFile(file);
        await api("/api/support/tickets/" + created.ticket.id + "/file", { method: "POST", body: JSON.stringify(payload) });
      }
      location.href = "/support/tickets/" + created.ticket.id;
    } catch (err) { error.textContent = err.message; }
  });
}

async function downloadFile(ticketId, fileId, name) {
  const response = await fetch("/api/support/tickets/" + ticketId + "/files/" + fileId, { credentials: "same-origin" });
  if (!response.ok) throw new Error("That file is not available.");
  const blob = await response.blob();
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = name || "attachment";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function detail(session, id) {
  const body = await api("/api/support/tickets/" + id);
  const ticket = body.ticket;
  const own = ticket.access === "own";
  const timeline = (ticket.statusHistory || []).map((row) => "<li>" + esc((row.at || "").slice(0, 16).replace("T", " ")) + " · " + esc(STATUS_LABEL[row.status] || row.status || "") + "</li>").join("");
  const notes = (ticket.messages || []).map((row) => '<div class="msg"><p><strong>Reply</strong> · ' + esc((row.at || "").slice(0, 16).replace("T", " ")) + "</p><p>" + esc(row.text) + "</p></div>").join("");
  const files = (ticket.files || []).map((file) => '<p><button class="ghost file-dl" type="button" data-file="' + esc(file.id) + '" data-name="' + esc(file.name) + '">' + esc(file.name) + "</button></p>").join("");
  app.innerHTML = nav(session) + '<p><a href="/support">Back to my tickets</a></p><h1>' + esc(ticket.number) + " · " + esc(ticket.subject) + "</h1><div class=\"card\"><p>" + esc(QUEUE_LABEL[ticket.queue] || ticket.queue) + " · " + esc(ticket.siteLabel) + " · " + esc(PRIORITY_LABEL[ticket.priority] || ticket.priority) + " · " + esc(ticket.statusLabel) + (ticket.overdue ? ' <span class="badge warn">Overdue</span>' : "") + (own ? "" : ' <span class="badge">Read only</span>') + "</p><p>" + esc(ticket.description) + "</p><h2>Status</h2><ul class=\"timeline\">" + (timeline || "<li>New</li>") + "</ul>" + notes + (files ? "<h2>Attachments</h2>" + files : "") + (own ? '<form id="support-comment"><label>Add a comment<textarea id="support-text"></textarea></label><label>Add a photo or PDF<input id="support-more" type="file" accept="image/*,application/pdf"></label><button type="submit">Add comment</button><p class="err" id="support-error"></p></form>' : "<p class=\"muted\">This ticket is read only.</p>") + "</div>";
  document.getElementById("support-out").addEventListener("click", signOut);
  for (const button of document.querySelectorAll(".file-dl")) {
    button.addEventListener("click", () => downloadFile(ticket.id, button.dataset.file, button.dataset.name).catch((err) => { const box = document.getElementById("support-error"); if (box) box.textContent = err.message; }));
  }
  const form = document.getElementById("support-comment");
  if (!form) return;
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const error = document.getElementById("support-error");
    error.textContent = "";
    try {
      const text = document.getElementById("support-text").value.trim();
      if (text) await api("/api/support/tickets/" + id + "/comment", { method: "POST", body: JSON.stringify({ text }) });
      const file = document.getElementById("support-more").files[0];
      if (file) {
        const payload = await prepareTicketFile(file);
        await api("/api/support/tickets/" + id + "/file", { method: "POST", body: JSON.stringify(payload) });
      }
      if (!text && !file) throw new Error("Write a comment or choose a file.");
      location.reload();
    } catch (err) { error.textContent = err.message; }
  });
}

async function boot() {
  let session = null;
  try { session = await api("/api/support/session"); } catch { session = null; }
  if (!session) return signIn();
  const r = route();
  if (r.name === "new") return create(session);
  if (r.name === "ticket") return detail(session, r.id);
  return home(session);
}
boot().catch((err) => { app.textContent = err.message; });
</script>
</body>
</html>
