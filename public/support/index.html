<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Support — Liberty Oil Convenience</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1b4d'/%3E%3Cpath fill='%23e7c98a' d='M9.5 8h13v3.2h-9.2V24H9.5z'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light; --ink:#1c2434; --muted:#667085; --line:#e6e8ee; --blue:#1f4bdb; --navy:#0e1b4d; --gold:#e7c98a; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; overflow-x:clip; }
  body { font:16px/1.45 "Segoe UI", system-ui, sans-serif; background:#f3f4f8; color:var(--ink); }
  .shell { width:min(390px,100%); margin:0 auto; padding:0 0 48px; }
  header { display:flex; gap:10px; align-items:center; padding:16px 16px 12px; }
  header strong { display:block; font-size:15px; }
  header small { color:var(--muted); font-size:13px; }
  .mark { width:32px; height:32px; flex:none; }
  main { padding:0 16px; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { margin:0 0 10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; }
  label { display:flex; flex-direction:column; gap:6px; font-weight:600; margin:12px 0; }
  input, select, textarea { font:inherit; padding:10px 12px; border:1px solid #d0d5dd; border-radius:8px; width:100%; }
  textarea { min-height:96px; }
  button, .btn { font:inherit; font-weight:700; background:var(--blue); color:#fff; border:0; border-radius:8px; padding:12px 14px; min-height:44px; width:100%; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
  button.ghost, .btn.ghost { background:#fff; color:var(--navy); border:1px solid var(--line); }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  a { color:var(--blue); }
  .muted { color:var(--muted); font-weight:400; }
  .err { color:#d92d20; min-height:1.2em; }
  .ok { color:#067647; }
  .ticket { display:block; text-decoration:none; color:inherit; }
  .ticket h2 { font-size:16px; margin:0 0 4px; }
  .badge { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; background:#f2f4f7; color:#344054; }
  .badge.warn { background:#fee4e2; color:#b42318; }
  ul.timeline { margin:8px 0; padding-left:18px; }
  .msg { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .hp { position:absolute; left:-10000px; width:1px; height:1px; overflow:hidden; }
  .linkbox { word-break:break-all; background:#f8f9fc; border:1px dashed #98a2b3; border-radius:8px; padding:10px; font-size:14px; }
  .notice { background:#fffaeb; border:1px solid #fedf89; border-radius:12px; padding:12px; margin:10px 0; }
  fieldset { border:0; padding:0; margin:12px 0; }
  legend { font-weight:600; margin-bottom:6px; }
  .choice { flex-direction:row; align-items:center; gap:8px; font-weight:400; margin:6px 0; }
  .choice input { width:auto; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0e1b4d"/><path fill="#e7c98a" d="M9.5 8h13v3.2h-9.2V24H9.5z"/></svg>
    <span><strong>Liberty Oil Convenience</strong><small>Express Help support</small></span>
  </header>
  <main id="app">Loading…</main>
</div>
<script type="module">
import { prepareTicketFile } from "/admin/ticket-file.mjs";

const PRIORITY_LABEL = { low: "Low", normal: "Normal", high: "High", urgent: "Urgent" };
const QUEUE_LABEL = { screens: "Screens", signage: "Signage" };
const app = document.getElementById("app");
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => "&#" + ch.charCodeAt(0) + ";");
const when = (iso) => {
  if (!iso) return "";
  try { return new Intl.DateTimeFormat("en-AU", { timeZone: "Australia/Melbourne", dateStyle: "medium", timeStyle: "short" }).format(new Date(iso)); } catch { return String(iso).slice(0, 16).replace("T", " "); }
};

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (opts.body) headers["content-type"] = "application/json";
  const response = await fetch(path, { ...opts, headers, credentials: "omit", referrerPolicy: "no-referrer" });
  const type = response.headers.get("content-type") || "";
  const body = type.includes("json") ? await response.json().catch(() => ({})) : null;
  if (!response.ok) throw new Error(body?.error || "That request was not completed.");
  return body;
}

async function form() {
  const meta = await api("/api/support/form");
  const sites = (meta.sites || []).map((site) => '<option value="' + esc(site.id) + '">' + esc(site.name) + "</option>").join("") + '<option value="other">My site is not listed</option>';
  const priorities = Object.entries(PRIORITY_LABEL).map(([value, label]) => '<option value="' + value + '"' + (value === "normal" ? " selected" : "") + ">" + esc(label) + "</option>").join("");
  app.innerHTML = '<h1>Submit a support ticket</h1><p class="muted">Screens and signage requests for Liberty Oil Convenience sites. No sign-in needed.</p>'
    + '<form class="card" id="support-new" novalidate>'
    + '<label>Full name<input id="support-name" required maxlength="80" autocomplete="name"></label>'
    + '<label>Work email<input id="support-email" type="email" required maxlength="254" autocomplete="email" placeholder="name@' + esc(meta.domain) + '"><span class="muted">Must be an @' + esc(meta.domain) + ' address.</span></label>'
    + '<label>Phone<input id="support-phone" type="tel" required maxlength="30" autocomplete="tel" placeholder="04xx xxx xxx"></label>'
    + '<label>Site<select id="support-site" required><option value="">Choose a site</option>' + sites + '</select></label>'
    + '<label id="support-other-wrap" hidden>Site name and suburb<input id="support-other" maxlength="80"></label>'
    + '<fieldset><legend>Queue</legend><label class="choice"><input type="radio" name="support-queue" value="screens"> Screens</label><label class="choice"><input type="radio" name="support-queue" value="signage"> Signage</label></fieldset>'
    + '<label>Request type<select id="support-type" required disabled><option value="">Choose a queue first</option></select></label>'
    + '<label>Priority<select id="support-priority" required>' + priorities + '</select></label>'
    + '<label>Needed by <span class="muted">(optional)</span><input id="support-by" type="date"></label>'
    + '<label>Subject<input id="support-subject" required maxlength="140"></label>'
    + '<label>Description<textarea id="support-body" required maxlength="4000"></textarea></label>'
    + '<label>Photos or PDFs <span class="muted">(optional, up to 3)</span><input id="support-files" type="file" accept="image/*,application/pdf" multiple></label>'
    + '<div class="hp" aria-hidden="true"><label>Website<input id="support-website" name="website" tabindex="-1" autocomplete="off"></label></div>'
    + '<button type="submit" id="support-submit">Submit ticket</button><p class="err" id="support-error" role="alert"></p></form>';
  const typeSelect = document.getElementById("support-type");
  for (const radio of document.querySelectorAll('input[name="support-queue"]')) {
    radio.addEventListener("change", () => {
      const queue = radio.value;
      typeSelect.disabled = false;
      typeSelect.innerHTML = '<option value="">Choose a request type</option>' + (meta.types?.[queue] || []).map((type) => '<option value="' + esc(type) + '">' + esc(type) + "</option>").join("");
    });
  }
  document.getElementById("support-site").addEventListener("change", (event) => { document.getElementById("support-other-wrap").hidden = event.target.value !== "other"; });
  document.getElementById("support-new").addEventListener("submit", async (event) => {
    event.preventDefault();
    const error = document.getElementById("support-error");
    const button = document.getElementById("support-submit");
    error.textContent = "";
    const queue = document.querySelector('input[name="support-queue"]:checked')?.value || "";
    const email = document.getElementById("support-email").value.trim();
    if (!new RegExp("@" + meta.domain.replace(/\./g, "\\.") + "$", "i").test(email)) { error.textContent = "Use your @" + meta.domain + " email address."; return; }
    if (!queue) { error.textContent = "Choose Screens or Signage."; return; }
    button.disabled = true;
    button.textContent = "Submitting…";
    try {
      const picked = Array.from(document.getElementById("support-files").files || []);
      if (picked.length > 3) throw new Error("Attach up to 3 files.");
      const files = [];
      for (const file of picked) files.push(await prepareTicketFile(file));
      const created = await api("/api/support/submit", { method: "POST", body: JSON.stringify({
        formToken: meta.formToken,
        website: document.getElementById("support-website").value,
        name: document.getElementById("support-name").value,
        email,
        phone: document.getElementById("support-phone").value,
        siteId: document.getElementById("support-site").value,
        siteOther: document.getElementById("support-other").value,
        queue,
        requestType: typeSelect.value,
        priority: document.getElementById("support-priority").value,
        neededBy: document.getElementById("support-by").value,
        subject: document.getElementById("support-subject").value,
        description: document.getElementById("support-body").value,
        files,
      }) });
      confirmation(created);
    } catch (err) {
      error.textContent = err.message;
      button.disabled = false;
      button.textContent = "Submit ticket";
    }
  });
}

function confirmation(created) {
  const link = location.origin + created.trackPath;
  history.replaceState(null, "", "/support");
  app.innerHTML = '<h1>Ticket ' + esc(created.number) + ' submitted</h1>'
    + '<div class="card"><p>Your ticket number is <strong>' + esc(created.number) + '</strong>.</p>'
    + '<div class="notice"><strong>Save this link now.</strong> It is the only way to check this ticket. It is not emailed to you and cannot be shown again. Bookmark it or copy it somewhere safe, and do not share it.</div>'
    + '<p class="linkbox" id="support-link">' + esc(link) + '</p>'
    + '<div class="row"><button type="button" id="support-copy">Copy link</button><a class="btn ghost" id="support-open" href="' + esc(created.trackPath) + '">Open tracking page</a></div>'
    + '<p class="ok" id="support-copied" role="status"></p>'
    + '<p><a href="/support" id="support-again">Submit another ticket</a></p></div>';
  document.getElementById("support-copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(link); document.getElementById("support-copied").textContent = "Link copied."; }
    catch { document.getElementById("support-copied").textContent = "Copy the link above by hand."; }
  });
}

async function track() {
  const hash = location.hash.replace(/^#/, "");
  const hit = hash.match(/^(\d+)\.([A-Za-z0-9_-]{40,64})$/);
  if (!hit) {
    app.innerHTML = '<h1>Track a ticket</h1><div class="card"><p>This tracking link is not valid. Use the full link shown when the ticket was submitted.</p><p><a href="/support">Submit a ticket</a></p></div>';
    return;
  }
  let ticket;
  try {
    ticket = (await api("/api/support/track", { method: "POST", body: JSON.stringify({ number: Number(hit[1]), token: hit[2] }) })).ticket;
  } catch (err) {
    app.innerHTML = '<h1>Track a ticket</h1><div class="card"><p>' + esc(err.message) + '</p><p><a href="/support">Submit a ticket</a></p></div>';
    return;
  }
  const timeline = (ticket.history || []).map((row) => "<li>" + esc(when(row.at)) + " · " + esc(row.status) + "</li>").join("");
  const replies = (ticket.replies || []).map((row) => '<div class="msg"><p><strong>' + esc(row.from) + '</strong> · ' + esc(when(row.at)) + "</p><p>" + esc(row.text) + "</p></div>").join("");
  app.innerHTML = '<h1>Ticket ' + esc(ticket.number) + '</h1><p class="muted">Read only. Bookmark this page to check back.</p>'
    + '<div class="card"><p><span class="badge">' + esc(ticket.status) + '</span></p>'
    + '<h2>' + esc(ticket.subject) + '</h2>'
    + '<p>' + esc(ticket.queue) + " · " + esc(ticket.site) + " · " + esc(ticket.requestType) + " · " + esc(ticket.priority) + '</p>'
    + '<p>' + esc(ticket.description) + '</p>'
    + '<h2>Status history</h2><ul class="timeline">' + (timeline || "<li>New</li>") + '</ul>'
    + '<h2>Replies</h2>' + (replies || '<p class="muted">No replies yet.</p>')
    + '<p class="muted">Last updated ' + esc(when(ticket.updatedAt)) + '</p></div>';
}

async function boot() {
  const path = location.pathname.replace(/\/+$/, "");
  if (path === "/support/track") return track();
  if (path !== "/support") history.replaceState(null, "", "/support");
  return form();
}
boot().catch((err) => { app.textContent = err.message; });
</script>
</body>
</html>
