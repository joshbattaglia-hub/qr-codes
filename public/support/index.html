<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Support — Liberty Oil Convenience</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1b4d'/%3E%3Cpath fill='%23e7c98a' d='M9.5 8h13v3.2h-9.2V24H9.5z'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light; --ink:#1c2434; --muted:#667085; --line:#e6e8ee; --blue:#1f4bdb; --navy:#0e1b4d; --gold:#e7c98a; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; overflow-x:clip; }
  body { font:16px/1.45 "Segoe UI", system-ui, sans-serif; background:#f3f4f8; color:var(--ink); }
  .shell { width:min(390px,100%); margin:0 auto; padding:0 0 48px; }
  body.wide .shell { width:min(1100px,100%); }
  body.wide .board { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  body.wide .board-row { flex-direction:column; gap:2px; }
  body.wide .board-row span:last-child { text-align:left; font-size:13px; }
  body.wide .filters { max-width:280px; }
  @media (max-width:760px) { body.wide .board { display:block; } body.wide .board-row { flex-direction:row; } body.wide .filters { max-width:none; } }
  header { display:flex; gap:10px; align-items:center; padding:16px 16px 12px; }
  header strong { display:block; font-size:15px; }
  header small { color:var(--muted); font-size:13px; }
  .mark { width:32px; height:32px; flex:none; }
  main { padding:0 16px; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { margin:0 0 10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:14px; }
  label { display:flex; flex-direction:column; gap:6px; font-weight:600; margin:12px 0; }
  input, select, textarea { font:inherit; padding:10px 12px; border:1px solid #d0d5dd; border-radius:8px; width:100%; }
  textarea { min-height:96px; }
  button, .btn { font:inherit; font-weight:700; background:var(--blue); color:#fff; border:0; border-radius:8px; padding:12px 14px; min-height:44px; width:100%; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
  button.ghost, .btn.ghost { background:#fff; color:var(--navy); border:1px solid var(--line); }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  a { color:var(--blue); }
  .muted { color:var(--muted); font-weight:400; }
  .err { color:#d92d20; min-height:1.2em; }
  .ok { color:#067647; }
  .ticket { display:block; text-decoration:none; color:inherit; }
  .ticket h2 { font-size:16px; margin:0 0 4px; }
  .badge { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; background:#f2f4f7; color:#344054; }
  .badge.warn { background:#fee4e2; color:#b42318; }
  ul.timeline { margin:8px 0; padding-left:18px; }
  .msg { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .hp { position:absolute; left:-10000px; width:1px; height:1px; overflow:hidden; }
  .linkbox { word-break:break-all; background:#f8f9fc; border:1px dashed #98a2b3; border-radius:8px; padding:10px; font-size:14px; }
  .notice { background:#fffaeb; border:1px solid #fedf89; border-radius:12px; padding:12px; margin:10px 0; }
  fieldset { border:0; padding:0; margin:12px 0; }
  legend { font-weight:600; margin-bottom:6px; }
  .choice { flex-direction:row; align-items:center; gap:8px; font-weight:400; margin:6px 0; }
  .choice input { width:auto; }
  .topnav { display:flex; gap:6px; margin:0 0 12px; }
  .topnav a { flex:1; text-align:center; padding:8px; border-radius:8px; border:1px solid var(--line); background:#fff; text-decoration:none; color:var(--navy); font-weight:600; font-size:14px; }
  .topnav a[aria-current="page"] { background:var(--navy); color:#fff; border-color:var(--navy); }
  .board-col h2 { font-size:16px; margin:0 0 6px; display:flex; justify-content:space-between; }
  .board-row { display:flex; justify-content:space-between; gap:8px; border-top:1px solid var(--line); padding:8px 0; font-size:14px; }
  .board-row:first-of-type { border-top:0; }
  .board-row a { color:inherit; text-decoration:none; }
  .board-row a:hover strong { text-decoration:underline; }
  .who { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; margin-bottom:8px; }
  .who button { width:auto; min-height:32px; padding:4px 10px; font-size:13px; }
  input[readonly] { background:#f2f4f7; color:#475467; }
  .board-row span:last-child { color:var(--muted); text-align:right; white-space:nowrap; }
  .filters { display:flex; gap:8px; }
  .filters > * { flex:1; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0e1b4d"/><path fill="#e7c98a" d="M9.5 8h13v3.2h-9.2V24H9.5z"/></svg>
    <span><strong>Liberty Oil Convenience</strong><small>Express Help support</small></span>
  </header>
  <main id="app">Loading…</main>
</div>
<script type="module">
import { prepareTicketFile } from "/admin/ticket-file.mjs";

const PRIORITY_LABEL = { low: "Low", normal: "Normal", high: "High", urgent: "Urgent" };
const app = document.getElementById("app");
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => "&#" + ch.charCodeAt(0) + ";");
const when = (iso) => {
  if (!iso) return "";
  try { return new Intl.DateTimeFormat("en-AU", { timeZone: "Australia/Melbourne", dateStyle: "medium", timeStyle: "short" }).format(new Date(iso)); } catch { return String(iso).slice(0, 16).replace("T", " "); }
};

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (opts.body) headers["content-type"] = "application/json";
  const response = await fetch(path, { ...opts, headers, credentials: "same-origin", referrerPolicy: "no-referrer" });
  const type = response.headers.get("content-type") || "";
  const body = type.includes("json") ? await response.json().catch(() => ({})) : null;
  if (!response.ok) { const err = new Error(body?.error || "That request was not completed."); err.status = response.status; throw err; }
  return body;
}

function signIn() {
  document.body.classList.remove("wide");
  app.innerHTML = '<h1>Support tickets</h1><p class="muted">Sign in with your @libertyretail.com.au email to submit and follow your screens and signage tickets.</p>'
    + '<form class="card" id="support-in"><label>Work email<input type="email" id="support-email" required maxlength="254" autocomplete="username" placeholder="name@libertyretail.com.au"></label>'
    + '<button type="submit" id="support-send">Email me a code</button>'
    + '<label id="support-code-wrap" hidden>8-digit code<input id="support-code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label>'
    + '<button type="button" class="ghost" id="support-verify" hidden>Verify code</button>'
    + '<p class="ok" id="support-status" role="status"></p><p class="err" id="support-error" role="alert"></p></form>'
    + '<p class="muted" style="font-size:14px">Have a private tracking link? Open it directly to check a ticket without signing in.</p>';
  const error = document.getElementById("support-error");
  document.getElementById("support-in").addEventListener("submit", async (event) => {
    event.preventDefault();
    error.textContent = "";
    const email = document.getElementById("support-email").value.trim();
    if (!/@libertyretail\.com\.au$/i.test(email)) { error.textContent = "Use your @libertyretail.com.au email address."; return; }
    try {
      const started = await api("/api/support/start", { method: "POST", body: JSON.stringify({ email }) });
      document.getElementById("support-status").textContent = started.message || "";
      document.getElementById("support-code-wrap").hidden = false;
      document.getElementById("support-verify").hidden = false;
      document.getElementById("support-code").focus();
    } catch (err) { error.textContent = err.message; }
  });
  document.getElementById("support-verify").addEventListener("click", async () => {
    error.textContent = "";
    try {
      await api("/api/support/verify", { method: "POST", body: JSON.stringify({ email: document.getElementById("support-email").value, code: document.getElementById("support-code").value }) });
      location.href = "/support";
    } catch (err) { error.textContent = err.message; }
  });
}

function header(session, current) {
  return '<div class="who"><span class="muted">Signed in as ' + esc(session.email) + '</span><button class="ghost" type="button" id="support-out">Sign out</button></div>'
    + '<nav class="topnav" aria-label="Support"><a href="/support"' + (current === "board" ? ' aria-current="page"' : "") + '>Board</a><a href="/support/list"' + (current === "list" ? ' aria-current="page"' : "") + '>List</a><a href="/support/new"' + (current === "new" ? ' aria-current="page"' : "") + '>Submit ticket</a></nav>';
}

function wireHeader() {
  document.getElementById("support-out")?.addEventListener("click", async () => {
    await api("/api/support/logout", { method: "POST", body: "{}" }).catch(() => null);
    location.href = "/support";
  });
}

async function board(session) {
  document.body.classList.add("wide");
  const data = await api("/api/support/tickets");
  const cols = (data.columns || []).map((col) => {
    const items = (data.tickets || []).filter((row) => row.column === col.id);
    return '<section class="card board-col" data-column="' + esc(col.id) + '"><h2>' + esc(col.label) + ' <span class="muted">' + items.length + "</span></h2>"
      + (items.map((row) => '<div class="board-row"><a href="/support/tickets/' + esc(row.id) + '"><strong>' + esc(row.number) + "</strong> · " + esc(row.subject) + '<br><span class="muted">' + esc(row.site) + " · " + esc(row.queueLabel) + "</span></a><span>" + esc(when(row.updatedAt)) + "</span></div>").join("") || '<p class="muted">None</p>')
      + "</section>";
  }).join("");
  app.innerHTML = header(session, "board") + '<h1>My tickets</h1><p class="muted">Only tickets you submitted, including ones you emailed in from this address.</p><div class="board">' + cols + "</div>";
  wireHeader();
}

async function list(session) {
  document.body.classList.remove("wide");
  const data = await api("/api/support/tickets");
  const rows = (data.tickets || []).map((row) => '<a class="card ticket" href="/support/tickets/' + esc(row.id) + '"><h2>' + esc(row.number) + " · " + esc(row.subject) + "</h2><p>" + esc(row.site) + " · " + esc(row.queueLabel) + ' · <span class="badge">' + esc(row.columnLabel) + '</span></p><p class="muted">Updated ' + esc(when(row.updatedAt)) + "</p></a>").join("");
  app.innerHTML = header(session, "list") + "<h1>My tickets</h1>" + (rows || '<div class="card"><p class="muted">No tickets yet. <a href="/support/new">Submit one</a>.</p></div>');
  wireHeader();
}

async function form(session) {
  document.body.classList.remove("wide");
  const meta = await api("/api/support/form");
  const sites = '<option value="national">All sites / National</option>' + (meta.sites || []).map((site) => '<option value="' + esc(site.id) + '">' + esc(site.name) + "</option>").join("") + '<option value="other">My site is not listed</option>';
  const priorities = Object.entries(PRIORITY_LABEL).map(([value, label]) => '<option value="' + value + '"' + (value === "normal" ? " selected" : "") + ">" + esc(label) + "</option>").join("");
  app.innerHTML = header(session, "new") + '<h1>Submit a support ticket</h1>'
    + '<form class="card" id="support-new" novalidate>'
    + '<label>Full name<input id="support-name" required maxlength="80" autocomplete="name"></label>'
    + '<label>Work email<input id="support-email" type="email" value="' + esc(meta.email) + '" readonly aria-readonly="true"><span class="muted">From your sign-in. Sign out to use a different address.</span></label>'
    + '<label>Phone<input id="support-phone" type="tel" required maxlength="30" autocomplete="tel" placeholder="04xx xxx xxx"></label>'
    + '<label>Site<select id="support-site" required><option value="">Choose a site</option>' + sites + '</select></label>'
    + '<label id="support-other-wrap" hidden>Site name and suburb<input id="support-other" maxlength="80"></label>'
    + '<fieldset><legend>Queue</legend><label class="choice"><input type="radio" name="support-queue" value="screens"> Screens</label><label class="choice"><input type="radio" name="support-queue" value="signage"> Signage</label></fieldset>'
    + '<label>Request type<select id="support-type" required disabled><option value="">Choose a queue first</option></select></label>'
    + '<label>Priority<select id="support-priority" required>' + priorities + '</select></label>'
    + '<label>Needed by <span class="muted">(optional)</span><input id="support-by" type="date"></label>'
    + '<label>Subject<input id="support-subject" required maxlength="140"></label>'
    + '<label>Description<textarea id="support-body" required maxlength="4000"></textarea></label>'
    + '<label>Photos or PDFs <span class="muted">(optional, up to 3)</span><input id="support-files" type="file" accept="image/*,application/pdf" multiple></label>'
    + '<div class="hp" aria-hidden="true"><label>Website<input id="support-website" name="website" tabindex="-1" autocomplete="off"></label></div>'
    + '<button type="submit" id="support-submit">Submit ticket</button><p class="err" id="support-error" role="alert"></p></form>';
  wireHeader();
  const typeSelect = document.getElementById("support-type");
  for (const radio of document.querySelectorAll('input[name="support-queue"]')) {
    radio.addEventListener("change", () => {
      typeSelect.disabled = false;
      typeSelect.innerHTML = '<option value="">Choose a request type</option>' + (meta.types?.[radio.value] || []).map((type) => '<option value="' + esc(type) + '">' + esc(type) + "</option>").join("");
    });
  }
  document.getElementById("support-site").addEventListener("change", (event) => { document.getElementById("support-other-wrap").hidden = event.target.value !== "other"; });
  document.getElementById("support-new").addEventListener("submit", async (event) => {
    event.preventDefault();
    const error = document.getElementById("support-error");
    const button = document.getElementById("support-submit");
    error.textContent = "";
    const queue = document.querySelector('input[name="support-queue"]:checked')?.value || "";
    if (!queue) { error.textContent = "Choose Screens or Signage."; return; }
    button.disabled = true;
    button.textContent = "Submitting…";
    try {
      const picked = Array.from(document.getElementById("support-files").files || []);
      if (picked.length > 3) throw new Error("Attach up to 3 files.");
      const files = [];
      for (const file of picked) files.push(await prepareTicketFile(file));
      const created = await api("/api/support/submit", { method: "POST", body: JSON.stringify({
        formToken: meta.formToken,
        website: document.getElementById("support-website").value,
        name: document.getElementById("support-name").value,
        phone: document.getElementById("support-phone").value,
        siteId: document.getElementById("support-site").value,
        siteOther: document.getElementById("support-other").value,
        queue,
        requestType: typeSelect.value,
        priority: document.getElementById("support-priority").value,
        neededBy: document.getElementById("support-by").value,
        subject: document.getElementById("support-subject").value,
        description: document.getElementById("support-body").value,
        files,
      }) });
      confirmation(session, created);
    } catch (err) {
      error.textContent = err.message;
      button.disabled = false;
      button.textContent = "Submit ticket";
    }
  });
}

function confirmation(session, created) {
  const link = location.origin + created.trackPath;
  history.replaceState(null, "", "/support/new");
  app.innerHTML = header(session, "new") + '<h1>Ticket ' + esc(created.number) + ' submitted</h1>'
    + '<div class="card"><p>Your ticket number is <strong>' + esc(created.number) + '</strong>. It is now on your board under Submitted, and you can follow it there whenever you sign in.</p>'
    + '<div class="row"><a class="btn" id="support-to-board" href="/support">Go to my tickets</a><a class="btn ghost" href="/support/tickets/' + esc(created.id) + '">View this ticket</a></div>'
    + '<details style="margin-top:12px"><summary>Private tracking link (optional)</summary><p class="muted" style="font-size:14px">Lets you check this ticket without signing in. Keep it private.</p><p class="linkbox" id="support-link">' + esc(link) + '</p><button type="button" class="ghost" id="support-copy">Copy link</button><p class="ok" id="support-copied" role="status"></p></details>'
    + '<p><a href="/support/new">Submit another ticket</a></p></div>';
  wireHeader();
  document.getElementById("support-copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(link); document.getElementById("support-copied").textContent = "Link copied."; }
    catch { document.getElementById("support-copied").textContent = "Copy the link above by hand."; }
  });
}

async function downloadFile(ticketId, fileId, name) {
  const response = await fetch("/api/support/tickets/" + ticketId + "/files/" + fileId, { credentials: "same-origin" });
  if (!response.ok) throw new Error("That file is not available.");
  const blob = await response.blob();
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = name || "attachment";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function detail(session, id) {
  document.body.classList.remove("wide");
  const ticket = (await api("/api/support/tickets/" + id)).ticket;
  const timeline = (ticket.history || []).map((row) => "<li>" + esc(when(row.at)) + " · " + esc(row.status) + "</li>").join("");
  const replies = (ticket.replies || []).map((row) => '<div class="msg"><p><strong>' + esc(row.from) + "</strong> · " + esc(when(row.at)) + "</p><p>" + esc(row.text) + "</p></div>").join("");
  const files = (ticket.files || []).map((file) => '<p><button class="ghost file-dl" type="button" data-file="' + esc(file.id) + '" data-name="' + esc(file.name) + '">' + esc(file.name) + "</button></p>").join("");
  app.innerHTML = header(session, "") + '<p><a href="/support">Back to my tickets</a></p><h1>' + esc(ticket.number) + " · " + esc(ticket.subject) + "</h1>"
    + '<div class="card"><p><span class="badge">' + esc(ticket.columnLabel) + "</span></p><p>" + esc(ticket.queueLabel) + " · " + esc(ticket.site) + " · " + esc(ticket.requestType) + " · " + esc(ticket.priorityLabel) + "</p>"
    + "<p>" + esc(ticket.description) + "</p><h2>Status history</h2><ul class=\"timeline\">" + (timeline || "<li>Submitted</li>") + "</ul>"
    + "<h2>Replies</h2>" + (replies || '<p class="muted">No replies yet.</p>') + (files ? "<h2>Attachments</h2>" + files : "")
    + '<form id="support-comment"><label>Add a comment<textarea id="support-text" maxlength="4000"></textarea></label><label>Add a photo or PDF<input id="support-more" type="file" accept="image/*,application/pdf"></label><button type="submit">Add comment</button><p class="err" id="support-error" role="alert"></p></form></div>';
  wireHeader();
  for (const button of document.querySelectorAll(".file-dl")) {
    button.addEventListener("click", () => downloadFile(ticket.id, button.dataset.file, button.dataset.name).catch((err) => { document.getElementById("support-error").textContent = err.message; }));
  }
  document.getElementById("support-comment").addEventListener("submit", async (event) => {
    event.preventDefault();
    const error = document.getElementById("support-error");
    error.textContent = "";
    try {
      const text = document.getElementById("support-text").value.trim();
      const file = document.getElementById("support-more").files[0];
      if (!text && !file) throw new Error("Write a comment or choose a file.");
      if (text) await api("/api/support/tickets/" + id + "/comment", { method: "POST", body: JSON.stringify({ text }) });
      if (file) await api("/api/support/tickets/" + id + "/file", { method: "POST", body: JSON.stringify(await prepareTicketFile(file)) });
      location.reload();
    } catch (err) { error.textContent = err.message; }
  });
}

async function track() {
  document.body.classList.remove("wide");
  const hash = location.hash.replace(/^#/, "");
  const hit = hash.match(/^(\d+)\.([A-Za-z0-9_-]{40,64})$/);
  if (!hit) {
    app.innerHTML = '<h1>Track a ticket</h1><div class="card"><p>This tracking link is not valid. Use the full link, or <a href="/support">sign in</a> to see your tickets.</p></div>';
    return;
  }
  let ticket;
  try {
    ticket = (await api("/api/support/track", { method: "POST", body: JSON.stringify({ number: Number(hit[1]), token: hit[2] }) })).ticket;
  } catch (err) {
    app.innerHTML = '<h1>Track a ticket</h1><div class="card"><p>' + esc(err.message) + '</p><p><a href="/support">Sign in to see your tickets</a></p></div>';
    return;
  }
  const timeline = (ticket.history || []).map((row) => "<li>" + esc(when(row.at)) + " · " + esc(row.status) + "</li>").join("");
  const replies = (ticket.replies || []).map((row) => '<div class="msg"><p><strong>' + esc(row.from) + "</strong> · " + esc(when(row.at)) + "</p><p>" + esc(row.text) + "</p></div>").join("");
  app.innerHTML = '<h1>Ticket ' + esc(ticket.number) + '</h1><p class="muted">Read only. <a href="/support">Sign in</a> to comment or see all your tickets.</p>'
    + '<div class="card"><p><span class="badge">' + esc(ticket.status) + '</span></p>'
    + '<h2>' + esc(ticket.subject) + '</h2>'
    + '<p>' + esc(ticket.queue) + " · " + esc(ticket.site) + " · " + esc(ticket.requestType) + " · " + esc(ticket.priority) + '</p>'
    + '<p>' + esc(ticket.description) + '</p>'
    + '<h2>Status history</h2><ul class="timeline">' + (timeline || "<li>Submitted</li>") + '</ul>'
    + '<h2>Replies</h2>' + (replies || '<p class="muted">No replies yet.</p>')
    + '<p class="muted">Last updated ' + esc(when(ticket.updatedAt)) + '</p></div>';
}

async function boot() {
  const path = location.pathname.replace(/\/+$/, "") || "/support";
  if (path === "/support/track") return track();
  let session = null;
  try { session = await api("/api/support/session"); } catch { session = null; }
  if (!session) return signIn();
  if (path === "/support/new") return form(session);
  if (path === "/support/list") return list(session);
  const ticket = path.match(/^\/support\/tickets\/(t[a-f0-9]{16})$/);
  if (ticket) return detail(session, ticket[1]);
  if (path !== "/support" && path !== "/support/board") history.replaceState(null, "", "/support");
  return board(session);
}
boot().catch((err) => { app.textContent = err.message; });
</script>
</body>
</html>
