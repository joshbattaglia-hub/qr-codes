<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>QR Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f6fa;color:#1d2433}
header{background:#1d2433;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
main{max-width:980px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
input,textarea{width:100%;padding:10px;border:1px solid #ccd;border-radius:8px;font:inherit;margin:4px 0 10px}
button{padding:9px 14px;border:0;border-radius:8px;background:#2f6fed;color:#fff;font:inherit;cursor:pointer}
button.sec{background:#e6e9f0;color:#1d2433}button.del{background:#d93636}button.lnk{background:none;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:640px){.grid{grid-template-columns:1fr}}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.code{display:flex;gap:14px;align-items:center;cursor:pointer}
.code .qr{width:64px;height:64px;flex:none}.muted{color:#6b7385;font-size:.9em}.tag{font-size:.75em;padding:2px 8px;border-radius:9px;background:#fde2e2;color:#a11}
.big{font-size:2em;font-weight:700}.err{color:#c22}.bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid #ccd}
.bars div{flex:1;background:#2f6fed;min-height:1px}table{width:100%;border-collapse:collapse}td{padding:4px 0;border-bottom:1px solid #eef}td:last-child{text-align:right}
.hidden{display:none}.break{word-break:break-all}
</style>
<header><b>QR Codes</b><button class="lnk hidden" id=logout>Log out</button></header>
<main id=app></main>
<script src="/admin/qrcode.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{'content-type':'application/json'},credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);return d};
const shortUrl=s=>location.origin+'/r/'+s;
const qr=s=>{const q=qrcode(0,'M');q.addData(shortUrl(s));q.make();return q};
const svgOf=s=>qr(s).createSvgTag({cellSize:10,margin:4,scalable:true});
function dl(name,href){const a=document.createElement('a');a.href=href;a.download=name;document.body.append(a);a.click();a.remove()}
function dlSvg(s){dl(s+'.svg',URL.createObjectURL(new Blob([svgOf(s)],{type:'image/svg+xml'})))}
function dlPng(s){const q=qr(s),n=q.getModuleCount(),m=4,sc=Math.max(8,Math.ceil(1024/(n+2*m))),c=document.createElement('canvas');c.width=c.height=(n+2*m)*sc;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*sc,(r+m)*sc,sc,sc);dl(s+'.png',c.toDataURL('image/png'))}
async function start(){const {authenticated}=await api('/api/auth');authenticated?list():login()}
function login(){$('#logout').classList.add('hidden');app.innerHTML=`<div class=card style="max-width:360px;margin:40px auto"><h2>Admin login</h2><form id=f><input type=password id=pw placeholder=Password autofocus><button>Log in</button><p class=err id=e></p></form></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth',{method:'POST',body:JSON.stringify({password:$('#pw').value})});list()}catch(x){$('#e').textContent=x.message}}}
$('#logout').onclick=async()=>{await api('/api/auth',{method:'DELETE'});login()};
async function list(){$('#logout').classList.remove('hidden');const cs=await api('/api/codes');
 app.innerHTML=`<div class=card><h3 style="margin-top:0">New QR code</h3><form id=nf><div class=grid><div><label>Destination URL *<input id=nurl type=url required placeholder="https://..."></label></div><div><label>Custom slug (optional)<input id=nslug placeholder="auto-generated"></label></div><div><label>Name<input id=nname></label></div><div><label>Notes<input id=nnotes></label></div></div><button>Create</button> <span class=err id=ne></span></form></div>
 <div class=card><h3 style="margin-top:0">Codes (${cs.length})</h3>${cs.map(c=>`<div class="code card" data-s="${esc(c.slug)}"><div class=qr>${svgOf(c.slug)}</div><div style="min-width:0"><b>${esc(c.name||c.slug)}</b> ${c.paused?'<span class=tag>Paused</span>':''}<div class="muted break">/r/${esc(c.slug)} → ${esc(c.url)}</div><div class=muted>${c.total} scans${c.last?' · last '+new Date(c.last).toLocaleString():''}</div></div></div>`).join('')||'<p class=muted>No codes yet.</p>'}</div>`;
 $('#nf').onsubmit=async e=>{e.preventDefault();try{const c=await api('/api/codes',{method:'POST',body:JSON.stringify({url:$('#nurl').value,slug:$('#nslug').value,name:$('#nname').value,notes:$('#nnotes').value})});detail(c.slug)}catch(x){$('#ne').textContent=x.message}};
 document.querySelectorAll('.code').forEach(el=>el.onclick=()=>detail(el.dataset.s))}
const tbl=o=>`<table>${Object.entries(o||{}).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')||'<tr><td class=muted>No data</td></tr>'}</table>`;
function chart(daily={}){const days=[];for(let i=29;i>=0;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);days.push([d,daily[d]||0])}const mx=Math.max(1,...days.map(d=>d[1]));return `<div class=bars>${days.map(([d,v])=>`<div title="${d}: ${v}" style="height:${v/mx*100}%"></div>`).join('')}</div><div class="row muted" style="justify-content:space-between"><span>${days[0][0]}</span><span>${days[29][0]}</span></div>`}
async function detail(s){const {code:c,stats:st}=await api('/api/codes/'+encodeURIComponent(s));
 app.innerHTML=`<p><button class=sec id=back>← All codes</button></p><div class=card><div class=row style="align-items:flex-start"><div style="width:180px">${svgOf(s)}</div><div style="flex:1;min-width:220px"><h2 style="margin:0">${esc(c.name||s)} ${c.paused?'<span class=tag>Paused</span>':''}</h2><p class=break><a href="${shortUrl(s)}" target=_blank>${shortUrl(s)}</a></p><div class=row><button id=png>Download PNG</button><button id=svg>Download SVG</button><button class=sec id=copy>Copy link</button></div></div></div></div>
 <div class=card><form id=ef><label>Destination URL<input id=eurl type=url required value="${esc(c.url)}"></label><div class=grid><div><label>Name<input id=ename value="${esc(c.name)}"></label></div><div><label>Notes<textarea id=enotes rows=2>${esc(c.notes)}</textarea></label></div></div><div class=row><button>Save</button><button type=button class=sec id=pause>${c.paused?'Resume':'Pause'}</button><button type=button class=del id=del>Delete</button><span id=msg></span></div></form></div>
 <div class=card><div class=row style="justify-content:space-between"><div><div class=big>${st.total||0}</div><div class=muted>total scans</div></div><div class=muted>${st.last?'Last scan '+new Date(st.last).toLocaleString():''}</div></div><h4>Last 30 days</h4>${chart(st.daily)}</div>
 <div class=grid><div class=card><h4 style="margin-top:0">Device</h4>${tbl(st.device)}<h4>OS</h4>${tbl(st.os)}</div><div class=card><h4 style="margin-top:0">Referrer</h4>${tbl(st.referrer)}<h4>Country</h4>${tbl(st.country)}<h4>City</h4>${tbl(st.city)}</div></div>`;
 $('#back').onclick=list;$('#png').onclick=()=>dlPng(s);$('#svg').onclick=()=>dlSvg(s);$('#copy').onclick=()=>navigator.clipboard.writeText(shortUrl(s));
 $('#ef').onsubmit=async e=>{e.preventDefault();try{await api('/api/codes/'+s,{method:'PATCH',body:JSON.stringify({url:$('#eurl').value,name:$('#ename').value,notes:$('#enotes').value})});$('#msg').textContent='Saved ✓'}catch(x){$('#msg').textContent=x.message}};
 $('#pause').onclick=async()=>{await api('/api/codes/'+s,{method:'PATCH',body:JSON.stringify({paused:!c.paused})});detail(s)};
 $('#del').onclick=async()=>{if(confirm('Delete /r/'+s+' and its stats? Printed QR codes will stop working.')){await api('/api/codes/'+s,{method:'DELETE'});list()}}}
start();
</script>
